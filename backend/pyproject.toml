[project]
name = "spreadsheet-api"
version = "0.1.0"
description = "Upload a spreadsheet, get a live queryable REST API — FastAPI backend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "supabase>=2.8",
    "asyncpg>=0.29",
    "pyjwt>=2.9",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
