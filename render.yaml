# Render Blueprint for the FastAPI backend.
# In Render: New + → Blueprint → connect this repo → it reads this file.
# Secret env vars (sync: false) are entered in the Render dashboard, not committed.
services:
  - type: web
    name: sheetwave-backend
    runtime: python
    plan: free
    rootDir: backend
    # Install deps, then compile the C++ rate limiter (pybind11). The native build
    # is non-fatal on purpose: if it fails, the app still deploys and uses the
    # pure-Python fallback, so a compiler hiccup never breaks production.
    buildCommand: >-
      pip install -r requirements.txt &&
      (pip install ./native ||
       echo "native ratelimiter build failed - using pure-Python fallback")
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: STORAGE_BUCKET
        value: raw-uploads
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
